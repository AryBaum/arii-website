<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="only light" />
		<meta name="theme-color" content="#e6e6e6" />
		<link rel="icon" href="%sveltekit.assets%/AriiLogo.png" />
		<script>
			// Skip the startup intro (see Intro.svelte) if it was already seen this visit.
			// Runs before the page paints so there's no flash of the intro.
			try {
				if (sessionStorage.getItem('arii-intro-seen')) document.documentElement.classList.add('intro-seen');
			} catch (e) {}
		</script>
		<noscript><style>.intro { display: none !important; }</style></noscript>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
